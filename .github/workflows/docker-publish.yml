# Build the ConvertXlsToXlsx Docker image for linux/amd64 and linux/arm64
# and publish it to Docker Hub as ac13139/xls2xlsx.
#
# Manual only: this workflow has no automatic triggers. Start it from the
# Actions tab ("Run workflow") with the desired inputs.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKER_HUB_USERNAME  - Docker Hub account name (ac13139)
#   DOCKER_HUB_TOKEN     - Docker Hub access token with write access

name: Publish multi-arch Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra image tag, e.g. 0.1.0 (latest is always pushed)
        required: false
        type: string

jobs:
  build-and-push:
    name: Build and push amd64 + arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # lets docker buildx use the GitHub Actions cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ac13139/xls2xlsx
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
